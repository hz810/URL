<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>境内 Docker 镜像加速与状态监控</title>
    <meta name="referrer" content="never">
    <link rel="shortcut icon" type="image/Docker.png" href="img/6.webp">
    <style>
        /* 纯正暗黑主题变量 */
        :root {
            --bg-color: #17181c;
            --card-bg: #212328;
            --text-main: #e5e7eb;
            --text-secondary: #9ca3af;
            --border-color: #33363d;
            --th-bg: #1a1c21;
            --hover-bg: #2a2d34;
            --primary-color: #3b82f6;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            line-height: 1.5; 
        }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        
        /* 导航栏 */
        .header { 
            background-color: var(--card-bg); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; 
            border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-color); 
        }
        
        /* 标题样式 */
        .logo { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 600; color: #fff; }
        .logo-icon { color: var(--primary-color); font-size: 24px; }
        
        .speed-badge {
            font-size: 12px;
            background: rgba(34, 197, 94, 0.15); 
            color: #4ade80; 
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
            margin-left: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .theme-toggle { color: var(--warning-color); font-size: 20px; }

        /* 统计卡片 */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
        .stat-card { 
            background-color: var(--card-bg); border-radius: 8px; padding: 20px; display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid var(--border-color); 
        }
        .stat-info .label { color: var(--text-secondary); font-size: 14px; margin-bottom: 10px; }
        .stat-info .value { font-size: 28px; font-weight: 600; color: #fff; }
        .stat-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        .icon-blue { background-color: rgba(59, 130, 246, 0.15); color: var(--primary-color); }
        .icon-green { background-color: rgba(34, 197, 94, 0.15); color: var(--success-color); }
        .icon-orange { background-color: rgba(245, 158, 11, 0.15); color: var(--warning-color); }
        .icon-red { background-color: rgba(239, 68, 68, 0.15); color: var(--danger-color); }

        /* 表格区域 */
        .table-container { 
            background-color: var(--card-bg); border-radius: 8px; padding: 24px; border: 1px solid var(--border-color); 
        }
        .table-header { font-size: 16px; font-weight: 600; margin-bottom: 20px; color: #fff; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { 
            background-color: var(--th-bg); color: var(--text-secondary); font-weight: 500; font-size: 13px; padding: 14px 16px; 
            border-bottom: 1px solid var(--border-color); 
        }
        th:first-child { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
        th:last-child { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
        td { padding: 16px; border-bottom: 1px solid var(--border-color); font-size: 14px; color: var(--text-main); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: var(--hover-bg); }
        
        /* 状态指示点 */
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
        .status-dot.green { background-color: var(--success-color); box-shadow: 0 0 8px rgba(34, 197, 94, 0.6); }
        .status-dot.orange { background-color: var(--warning-color); box-shadow: 0 0 8px rgba(245, 158, 11, 0.6); }
        .status-dot.red { background-color: var(--danger-color); box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }
        .status-dot.pending { background-color: #4b5563; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* 标签 */
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-right: 6px; margin-bottom: 4px; border: 1px solid transparent; }
        .tag-blue { background-color: rgba(59, 130, 246, 0.1); color: #60a5fa; border-color: rgba(59, 130, 246, 0.2); }
        .tag-orange { background-color: rgba(245, 158, 11, 0.1); color: #fbbf24; border-color: rgba(245, 158, 11, 0.2); }
        .tag-cyan { background-color: rgba(6, 182, 212, 0.1); color: #22d3ee; border-color: rgba(6, 182, 212, 0.2); }
        .tag-purple { background-color: rgba(168, 85, 247, 0.1); color: #c084fc; border-color: rgba(168, 85, 247, 0.2); }
        .tag-gray { background-color: rgba(156, 163, 175, 0.1); color: #d1d5db; border-color: rgba(156, 163, 175, 0.2); }
        .tag-green { background-color: rgba(34, 197, 94, 0.1); color: #4ade80; border-color: rgba(34, 197, 94, 0.2); }
        .tag-red { background-color: rgba(239, 68, 68, 0.1); color: #f87171; border-color: rgba(239, 68, 68, 0.2); }
        
        /* ======= 修改了这里：去掉了下划线 ======= */
        .url-cell { display: flex; align-items: center; gap: 8px; }
        .url-text { 
            color: #60a5fa; 
            text-decoration: none; /* 去掉下划线 */
            transition: color 0.2s;
        }
        .url-text:hover { 
            color: #93c5fd; /* 鼠标放上去变亮一点 */
            /* 不再有 text-decoration: underline; */
        }
        /* ======================================= */

        .copy-btn { cursor: pointer; color: var(--text-secondary); font-size: 14px; padding: 4px 6px; border-radius: 4px; border: 1px solid transparent; }
        .copy-btn:hover { background-color: rgba(59, 130, 246, 0.15); color: #60a5fa; border-color: rgba(59, 130, 246, 0.3); }
        .time-text { color: var(--text-secondary); font-size: 13px; }

        @media (max-width: 992px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .stats-grid { grid-template-columns: 1fr; } .table-container { overflow-x: auto; padding: 16px; } table { min-width: 800px; } }
    </style>
</head>
<body>
<div class="container">
    <header class="header">
        <div class="logo">
            <span class="logo-icon">🐳</span> 
            境内 Docker 镜像加速与状态监控
            <span class="speed-badge">🚀 极速</span>
        </div>
        <div class="theme-toggle">🌙</div>
    </header>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-info"><div class="label">总监控站点</div><div class="value" id="stat-total">0</div></div><div class="stat-icon icon-blue">📊</div></div>
        <div class="stat-card"><div class="stat-info"><div class="label">正常运行</div><div class="value" id="stat-normal">0</div></div><div class="stat-icon icon-green">✔️</div></div>
        <div class="stat-card"><div class="stat-info"><div class="label">响应缓慢</div><div class="value" id="stat-slow">0</div></div><div class="stat-icon icon-orange">⚠️</div></div>
        <div class="stat-card"><div class="stat-info"><div class="label">离线/被拦截</div><div class="value" id="stat-offline">0</div></div><div class="stat-icon icon-red">❌</div></div>
    </div>

    <div class="table-container">
        <div class="table-header">加速站点监控列表</div>
        <table>
            <thead><tr><th width="10%">当前状态</th><th width="20%">站点名称</th><th width="35%">URL 地址</th><th width="20%">标签</th><th width="15%">最后检测</th></tr></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<script>
    const sitesData = [
        { id: 'site-1', name: 'DaoCloud', url: 'https://docker.m.daocloud.io', tagName: '老牌', tagClass: 'tag-green' },
        { id: 'site-2', name: '毫秒镜像', url: 'https://docker.1ms.run', tagName: '商业', tagClass: 'tag-blue' },
        { id: 'site-3', name: '轩辕镜像(免费)', url: 'https://docker.xuanyuan.me', tagName: '公益', tagClass: 'tag-cyan' },
        { id: 'site-4', name: '1Panel', url: 'https://docker.1panel.live', tagName: '社区', tagClass: 'tag-blue' },
        { id: 'site-5', name: 'Docker Proxy', url: 'https://dockerproxy.net', tagName: '代理', tagClass: 'tag-purple' },
        { id: 'site-6', name: 'Docker Proxy (备用)', url: 'https://dockerproxy.link', tagName: '备用', tagClass: 'tag-gray' },
        { id: 'site-7', name: '简行镜像', url: 'https://docker.jiaxin.site', tagName: '社区', tagClass: 'tag-gray' },
        { id: 'site-8', name: 'HpCloud', url: 'https://docker.hpcloud.cloud', tagName: '社区', tagClass: 'tag-gray' },
        { id: 'site-9', name: '3ms 镜像', url: 'https://docker.3ms.run', tagName: '社区', tagClass: 'tag-gray' },
        { id: 'site-10', name: '轩辕镜像(专业)', url: 'https://xuanyuan.cloud', tagName: '商业', tagClass: 'tag-orange' }
    ];

    const tbody = document.getElementById('table-body');
    let counts = { green: 0, orange: 0, red: 0 };

    function getNowTime() {
        const now = new Date();
        return String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
    }

    function copyToClipboard(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text; 
        textArea.style.position = "fixed"; 
        textArea.style.top = "-9999px";
        document.body.appendChild(textArea); 
        textArea.focus(); 
        textArea.select();
        try { document.execCommand('copy'); } catch (err) {}
        document.body.removeChild(textArea);
    }

    function initTable() {
        let html = '';
        sitesData.forEach(site => {
            html += `
            <tr id="${site.id}">
                <td><span class="status-dot pending"></span></td>
                <td>${site.name}</td>
                <td>
                    <div class="url-cell">
                        <span class="url-text">${site.url}</span>
                        <span class="copy-btn" onclick="copyToClipboard('${site.url}')">📋</span>
                    </div>
                </td>
                <td><span class="tag ${site.tagClass}">${site.tagName}</span></td>
                <td class="time-text">等待测速</td>
            </tr>`;
        });
        tbody.innerHTML = html;
    }

    function updateStats() {
        document.getElementById('stat-total').innerText = sitesData.length;
        document.getElementById('stat-normal').innerText = counts.green;
        document.getElementById('stat-slow').innerText = counts.orange;
        document.getElementById('stat-offline').innerText = counts.red;
    }

    async function checkSingleSite(site) {
        const startTime = Date.now();
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);

        let status = 'red';
        try {
            await fetch(site.url, { 
                mode: 'no-cors', 
                cache: 'no-cache', 
                method: 'HEAD', 
                signal: controller.signal 
            });
            clearTimeout(timeoutId);
            const responseTime = Date.now() - startTime;
            status = responseTime > 1500 ? 'orange' : 'green';
        } catch (error) {
            clearTimeout(timeoutId);
            status = 'red';
        }

        const tr = document.getElementById(site.id);
        if (tr) {
            const dot = tr.querySelector('.status-dot');
            if (dot) dot.className = `status-dot ${status}`;
            const timeEl = tr.querySelector('.time-text');
            if (timeEl) timeEl.innerText = getNowTime();
        }

        counts[status]++;
        updateStats();
    }

    function startChecking() {
        initTable(); 
        counts = { green: 0, orange: 0, red: 0 }; 
        updateStats();
        sitesData.forEach(site => checkSingleSite(site));
    }

    startChecking();
    setInterval(startChecking, 30000);
</script>
</body>
</html>
