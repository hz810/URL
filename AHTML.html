<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 在线运行工具</title>
    <link rel="shortcut icon" type="image/ico" href="img/18.webp">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
        body { background: #0d1117; display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: #e6edf3; }
        .toolbar { display: flex; align-items: center; justify-content: flex-start; padding: 12px 20px; background: #161b22; border-bottom: 1px solid #30363d; flex-wrap: wrap; gap: 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4); z-index: 10; flex-shrink: 0; }
        .toolbar-title { font-size: 18px; font-weight: 600; background: linear-gradient(135deg, #79c0ff, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 0.3px; display: flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0; }
        .toolbar-title::before { content: "⚡"; font-size: 22px; background: none; -webkit-text-fill-color: #f0b429; }
        .toolbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-start; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 18px; border: 1px solid #30363d; border-radius: 30px; background: #21262d; color: #e6edf3; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); min-width: 110px; justify-content: center; text-align: center; user-select: none; }
        .btn:hover { background: #30363d; border-color: #8b949e; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); background: #3c444d; }
        .btn-primary { background: #238636; border-color: #2ea043; color: white; font-weight: 600; }
        .btn-primary:hover { background: #2ea043; border-color: #3fb950; }
        .btn-outline { background: transparent; border-color: #484f58; }
        .btn-outline:hover { background: #21262d; border-color: #6e7681; }
        .btn i { font-style: normal; font-size: 16px; }
        .btn-format { border-color: #6e40c9; background: #1c1530; color: #d2b3ff; }
        .btn-format:hover { background: #2d1f4a; border-color: #a78bfa; box-shadow: 0 0 10px rgba(167, 139, 250, 0.3); }
        .btn-clear { border-color: #6e2d2d; background: #1c1010; color: #ff9c9c; }
        .btn-clear:hover { background: #2d1616; border-color: #f85149; color: #ffb3b3; box-shadow: 0 0 10px rgba(248, 81, 73, 0.3); }
        .btn-toggle-snippet { border-color: #1f6feb; background: #0d1a2b; color: #79c0ff; min-width: 100px; }
        .btn-toggle-snippet:hover { background: #132338; border-color: #58a6ff; color: #a5d6ff; box-shadow: 0 0 10px rgba(88, 166, 255, 0.25); }

        .snippet-panel { background: #0f141b; border-bottom: 1px solid #21262d; flex-shrink: 0; overflow: hidden; transition: max-height 0.25s ease; scrollbar-width: thin; scrollbar-color: #484f58 #0f141b; }
        .snippet-panel.collapsed { max-height: 42px; overflow: hidden; }
        .snippet-panel.expanded { max-height: 50vh; overflow-y: auto; }
        .snippet-panel::-webkit-scrollbar { width: 10px; }
        .snippet-panel::-webkit-scrollbar-track { background: #0f141b; }
        .snippet-panel::-webkit-scrollbar-thumb { background: #484f58; border-radius: 5px; }
        .snippet-panel::-webkit-scrollbar-thumb:hover { background: #6e7681; }

        .snippet-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 20px; border-bottom: 1px solid #161b22; flex-wrap: wrap; }
        .snippet-row:last-child { border-bottom: none; }

        .snippet-group-label { flex-shrink: 0; width: 68px; font-size: 12px; font-weight: 700; color: #58a6ff; letter-spacing: 0.5px; padding-top: 5px; text-align: right; border-right: 2px solid #58a6ff; padding-right: 8px; margin-right: 4px; opacity: 0.9; }

        .snippet-buttons { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; align-items: center; }

        .snippet-btn { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border: 1px solid #30363d; border-radius: 6px; background: #1c2128; color: #c9d1d9; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s ease; white-space: nowrap; user-select: none; flex-shrink: 0; font-family: 'Fira Code', 'Consolas', monospace; }
        .snippet-btn:hover { background: #2d333b; border-color: #58a6ff; color: #79c0ff; transform: translateY(-1px); box-shadow: 0 2px 6px rgba(88, 166, 255, 0.15); }
        .snippet-btn:active { transform: translateY(0); background: #373e47; }

        /* 一键演示按钮 */
        .snippet-play-btn {
            display: inline-flex; align-items: center; gap: 3px;
            padding: 4px 8px; border: 1px solid #2ea043;
            border-radius: 6px; background: #0d1f10; color: #7ee787;
            font-size: 11px; font-weight: 600; cursor: pointer;
            transition: all 0.15s ease; white-space: nowrap;
            user-select: none; flex-shrink: 0;
        }
        .snippet-play-btn:hover {
            background: #14291a; border-color: #3fb950; color: #aff5b4;
            box-shadow: 0 0 8px rgba(46, 160, 67, 0.3);
        }
        .snippet-play-btn:active { transform: scale(0.96); }
        /* 演示中：橙色 */
        .snippet-play-btn.playing {
            border-color: #d29922; background: #2a1f06; color: #f0b429;
        }
        .snippet-play-btn.playing:hover {
            background: #3a2c08; border-color: #e3b341; color: #f7c948;
            box-shadow: 0 0 8px rgba(210, 153, 34, 0.3);
        }
        /* 暂停中：灰蓝色 */
        .snippet-play-btn.paused {
            border-color: #484f58; background: #1c2128; color: #8b949e;
        }
        .snippet-play-btn.paused:hover {
            background: #2d333b; border-color: #6e7681; color: #c9d1d9;
            box-shadow: none;
        }

        .auto-toggle { display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 30px; font-size: 13px; font-weight: 600; cursor: pointer; user-select: none; transition: all 0.25s ease; white-space: nowrap; border: 1px solid; min-width: 130px; justify-content: center; }
        .auto-toggle.on { background: rgba(35, 134, 54, 0.2); border-color: #2ea043; color: #7ee787; box-shadow: 0 0 12px rgba(46, 160, 67, 0.25); }
        .auto-toggle.on:hover { background: rgba(35, 134, 54, 0.3); box-shadow: 0 0 16px rgba(46, 160, 67, 0.4); }
        .auto-toggle.off { background: rgba(210, 153, 34, 0.15); border-color: #d29922; color: #f0b429; }
        .auto-toggle.off:hover { background: rgba(210, 153, 34, 0.25); }
        .auto-toggle .dot { width: 8px; height: 8px; border-radius: 50%; transition: all 0.25s ease; }
        .auto-toggle.on .dot { background: #3fb950; box-shadow: 0 0 8px #3fb950; animation: pulse 1.5s ease-in-out infinite; }
        .auto-toggle.off .dot { background: #d29922; box-shadow: none; animation: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.75); } }
        .status-msg { font-size: 12px; color: #7ee787; opacity: 0; transition: opacity 0.3s; white-space: nowrap; min-width: 130px; text-align: left; }
        .status-msg.show { opacity: 1; }
        .main-container { display: flex; flex: 1; overflow: hidden; background: #0d1117; }
        .editor-panel { flex: 1; display: flex; flex-direction: column; min-width: 260px; background: #0d1117; border-right: 1px solid #30363d; }
        .preview-panel { flex: 1; display: flex; flex-direction: column; background: #0d1117; min-width: 260px; }
        .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 40px; min-height: 40px; background: #161b22; border-bottom: 1px solid #30363d; font-size: 13px; font-weight: 500; color: #8b949e; letter-spacing: 0.5px; flex-shrink: 0; }
        .panel-header span { display: flex; align-items: center; gap: 6px; line-height: 1; }
        .panel-header .editor-icon::before { content: "📝"; font-size: 15px; }
        .panel-header .preview-icon::before { content: "👁️"; font-size: 15px; }
        .preview-actions { display: flex; gap: 8px; align-items: center; }
        .preview-actions .btn { padding: 0 12px; height: 26px; font-size: 12px; border-radius: 13px; background: #21262d; min-width: auto; line-height: 1; }
        .code-editor { flex: 1; width: 100%; padding: 20px; background: #0d1117; color: #c9d1d9; font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'Consolas', 'Monaco', monospace; font-size: 14px; line-height: 1.6; border: none; outline: none; resize: none; tab-size: 2; overflow: auto; white-space: pre; caret-color: #79c0ff; letter-spacing: 0.2px; }
        .code-editor::placeholder { color: #484f58; }
        .code-editor::selection { background: #2f4f6f; }
        .code-editor::-webkit-scrollbar { width: 20px; height: 20px; }
        .code-editor::-webkit-scrollbar-track { background: #161b22; border-radius: 10px; }
        .code-editor::-webkit-scrollbar-thumb { background: #6e7681; border-radius: 10px; border: 4px solid #161b22; min-height: 80px; min-width: 80px; }
        .code-editor::-webkit-scrollbar-thumb:hover { background: #8b949e; border-color: #21262d; }
        .code-editor::-webkit-scrollbar-thumb:active { background: #c9d1d9; }
        .code-editor::-webkit-scrollbar-corner { background: #161b22; }
        .code-editor::-webkit-scrollbar-button { display: none; }
        .code-editor { scrollbar-width: auto; scrollbar-color: #6e7681 #161b22; }
        .preview-iframe { flex: 1; width: 100%; background: #0d1117; border: none; outline: none; display: block; color-scheme: dark; }
        @media (max-width: 820px) { .toolbar { flex-direction: column; align-items: flex-start; gap: 10px; } .toolbar-actions { justify-content: flex-start; gap: 8px; } .status-msg { min-width: auto; text-align: left; } .snippet-group-label { width: 56px; font-size: 11px; } }
        @media (max-width: 640px) { .main-container { flex-direction: column; } .editor-panel { border-right: none; border-bottom: 1px solid #30363d; max-height: 45vh; } .preview-panel { max-height: 55vh; } .btn { padding: 6px 14px; font-size: 13px; min-width: 90px; } .toolbar-title { font-size: 16px; } .auto-toggle { min-width: 110px; padding: 6px 12px; font-size: 12px; } .snippet-row { padding: 5px 12px; } }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="toolbar-title">HTML 在线运行工具</div>
        <div class="toolbar-actions">
            <div class="auto-toggle on" id="autoToggle" title="点击暂停/开启自动运行">
                <span class="dot"></span>
                <span id="autoToggleText">自动运行中</span>
            </div>
            <button class="btn btn-primary" id="runBtn" title="强制刷新 (Ctrl+Enter)"><i>▶</i> 运行预览</button>
            <button class="btn btn-outline" id="newWindowBtn" title="在新窗口打开预览"><i>⧉</i> 新窗口运行</button>
            <button class="btn btn-outline" id="copyBtn" title="复制编辑器中的代码"><i>📋</i> 复制代码</button>
            <button class="btn btn-outline" id="downloadBtn" title="下载为 HTML 文件"><i>⬇️</i> 下载 HTML</button>
            <button class="btn btn-format" id="formatBtn" title="整理 HTML 标签换行（不破坏运行）"><i>⏎</i> 整理换行</button>
            <button class="btn btn-clear" id="clearBtn" title="清空编辑器"><i>🗑</i> 一键清空</button>
            <button class="btn btn-toggle-snippet" id="toggleSnippetBtn" title="展开/收起常用代码">
                <i>📂</i> <span id="toggleSnippetText">展开代码</span>
            </button>
            <span id="statusMsg" class="status-msg"></span>
        </div>
    </div>

    <div class="snippet-panel collapsed" id="snippetPanel"></div>

    <div class="main-container">
        <div class="editor-panel">
            <div class="panel-header">
                <span class="editor-icon">HTML 代码编辑器</span>
                <span></span>
            </div>
            <textarea id="codeEditor" class="code-editor" spellcheck="false" placeholder="在此输入 HTML、CSS、JavaScript..."></textarea>
        </div>
        <div class="preview-panel">
            <div class="panel-header">
                <span class="preview-icon">实时预览</span>
                <div class="preview-actions">
                    <button class="btn" id="refreshPreviewBtn" title="刷新预览">↻ 刷新</button>
                </div>
            </div>
            <iframe id="previewFrame" class="preview-iframe" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-same-origin" title="预览"></iframe>
        </div>
    </div>

    <script>
        (function() {
            var editor = document.getElementById('codeEditor');
            var previewFrame = document.getElementById('previewFrame');
            var runBtn = document.getElementById('runBtn');
            var newWindowBtn = document.getElementById('newWindowBtn');
            var copyBtn = document.getElementById('copyBtn');
            var downloadBtn = document.getElementById('downloadBtn');
            var refreshPreviewBtn = document.getElementById('refreshPreviewBtn');
            var formatBtn = document.getElementById('formatBtn');
            var clearBtn = document.getElementById('clearBtn');
            var toggleSnippetBtn = document.getElementById('toggleSnippetBtn');
            var toggleSnippetText = document.getElementById('toggleSnippetText');
            var statusMsg = document.getElementById('statusMsg');
            var autoToggle = document.getElementById('autoToggle');
            var autoToggleText = document.getElementById('autoToggleText');
            var snippetPanel = document.getElementById('snippetPanel');

            var autoRunEnabled = true;
            var lastRenderedCode = '';
            var statusTimeout;
            var snippetExpanded = false;

            // ============ 演示控制 ============
            var playTimer = null;
            var playIndex = 0;
            var playItems = null;
            var playGroupName = '';
            var playPaused = false;
            var playBtnRef = null;

            function showStatus(message, isError) {
                statusMsg.textContent = message;
                statusMsg.style.color = isError ? '#f85149' : '#7ee787';
                statusMsg.classList.add('show');
                clearTimeout(statusTimeout);
                statusTimeout = setTimeout(function() { statusMsg.classList.remove('show'); }, 2500);
            }

            function getNowDate() {
                var d = new Date();
                var y = d.getFullYear();
                var m = d.getMonth() + 1;
                var day = d.getDate();
                if (m < 10) m = '0' + m;
                if (day < 10) day = '0' + day;
                return y + '年' + m + '月' + day + '日';
            }

            function updatePreview(force) {
                var code = editor.value;
                if (!force && code === lastRenderedCode) return;
                lastRenderedCode = code;
                if (!code.trim()) {
                    previewFrame.srcdoc = '\x3C!DOCTYPE html\x3E\x3Chtml\x3E\x3Chead\x3E\x3Cmeta charset="UTF-8"\x3E\x3Cstyle\x3Ehtml,body{margin:0;padding:0;height:100%;background:#0d1117;}\x3C/style\x3E\x3C/head\x3E\x3Cbody\x3E\x3C/body\x3E\x3C/html\x3E';
                } else {
                    previewFrame.srcdoc = code;
                }
            }

            editor.addEventListener('input', function() {
                if (autoRunEnabled) updatePreview();
            });

            autoToggle.addEventListener('click', function() {
                autoRunEnabled = !autoRunEnabled;
                if (autoRunEnabled) {
                    autoToggle.classList.remove('off');
                    autoToggle.classList.add('on');
                    autoToggleText.textContent = '自动运行中';
                    updatePreview(true);
                    showStatus('自动运行已开启');
                } else {
                    autoToggle.classList.remove('on');
                    autoToggle.classList.add('off');
                    autoToggleText.textContent = '已暂停自动';
                    showStatus('自动运行已暂停');
                }
            });

            function runPreview() { updatePreview(true); showStatus('预览已更新'); }
            function openInNewWindow() {
                var blob = new Blob([editor.value], { type: 'text/html' });
                var url = URL.createObjectURL(blob);
                window.open(url, '_blank');
                setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
                showStatus('已在新窗口打开');
            }
            function copyCode() {
                navigator.clipboard.writeText(editor.value).then(function() {
                    showStatus('代码已复制到剪贴板');
                }).catch(function() {
                    editor.select();
                    document.execCommand('copy');
                    editor.setSelectionRange(0, 0);
                    showStatus('代码已复制 (兼容模式)');
                });
            }
            function downloadHTML() {
                var blob = new Blob([editor.value], { type: 'text/html' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'online-preview.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showStatus('开始下载 HTML 文件');
            }
            function refreshPreview() { updatePreview(true); showStatus('预览已刷新'); }

            function clearEditor() {
                stopPlay();
                if (!editor.value.trim()) {
                    showStatus('编辑器已是空的', true);
                    return;
                }
                editor.value = '';
                lastRenderedCode = '';
                updatePreview(true);
                editor.focus();
                showStatus('🗑 已清空编辑器');
            }

            function toggleSnippet() {
                snippetExpanded = !snippetExpanded;
                if (snippetExpanded) {
                    snippetPanel.classList.remove('collapsed');
                    snippetPanel.classList.add('expanded');
                    toggleSnippetText.textContent = '收起代码';
                    toggleSnippetBtn.querySelector('i').textContent = '📁';
                } else {
                    snippetPanel.classList.remove('expanded');
                    snippetPanel.classList.add('collapsed');
                    toggleSnippetText.textContent = '展开代码';
                    toggleSnippetBtn.querySelector('i').textContent = '📂';
                }
            }

            toggleSnippetBtn.addEventListener('click', toggleSnippet);

            // ================================================================
            // 一键演示：支持点击暂停 / 再点击继续
            // ================================================================
            function stopPlay() {
                if (playTimer) { clearTimeout(playTimer); playTimer = null; }
                if (playBtnRef) {
                    playBtnRef.classList.remove('playing');
                    playBtnRef.classList.remove('paused');
                }
                playItems = null;
                playIndex = 0;
                playPaused = false;
                playBtnRef = null;
            }

            function updatePlayBtnText() {
                if (!playBtnRef) return;
                if (playPaused) {
                    playBtnRef.textContent = '⏸ 已暂停停';
                    playBtnRef.classList.remove('playing');
                    playBtnRef.classList.add('paused');
                } else {
                    playBtnRef.textContent = '⏸ 演示中中';
                    playBtnRef.classList.remove('paused');
                    playBtnRef.classList.add('playing');
                }
            }

            function playStep() {
                if (!playItems || playPaused) return;
                if (playIndex >= playItems.length) {
                    if (playBtnRef) {
                        playBtnRef.textContent = '▶ 一键演示';
                        playBtnRef.classList.remove('playing');
                        playBtnRef.classList.remove('paused');
                    }
                    showStatus('✅ ' + playGroupName + ' 一组演示完毕（共 ' + playItems.length + ' 个）');
                    playTimer = null;
                    playItems = null;
                    playIndex = 0;
                    playBtnRef = null;
                    playPaused = false;
                    return;
                }

                var item = playItems[playIndex];
                var text = item.getInsert ? item.getInsert() : item.insert;
                editor.value = text;
                lastRenderedCode = text;
                previewFrame.srcdoc = text;
                showStatus('▶ ' + (playIndex + 1) + '/' + playItems.length + '：' + item.label);
                playIndex++;
                playTimer = setTimeout(playStep, 900);
            }

            function togglePlayGroup(groupItems, groupName, btn) {
                // 如果正在演示同一组
                if (playItems === groupItems && playBtnRef === btn) {
                    if (playPaused) {
                        // 继续
                        playPaused = false;
                        updatePlayBtnText();
                        showStatus('▶ 继续演示：' + groupName);
                        playTimer = setTimeout(playStep, 300);
                    } else {
                        // 暂停
                        playPaused = true;
                        if (playTimer) { clearTimeout(playTimer); playTimer = null; }
                        updatePlayBtnText();
                        showStatus('⏸ 已暂停停：' + groupName);
                    }
                    return;
                }

                // 停止上一次演示
                stopPlay();

                // 开始新演示
                playItems = groupItems;
                playIndex = 0;
                playGroupName = groupName;
                playPaused = false;
                playBtnRef = btn;
                updatePlayBtnText();
                showStatus('▶ 开始演示：' + groupName);
                playStep();
            }

            // ================================================================
            // 常用代码快捷插入
            // ================================================================
            var SNIPPETS = [
                { group: '常用', items: [
                    { label: '居中',       insert: '\x3Ccenter\x3E这里放内容\x3C/center\x3E' },
                    { label: '换行',       insert: '\x3Cbr\x3E' },
                    { label: '注释',       insert: '\x3C!-- 注释内容 --\x3E' },
                    { label: '块注释',     insert: '/*/ 注释内容 /*/' },
                    { label: '贴图',       insert: '\x3Cimg src="图片链接" alt="图片"\x3E' },
                    { label: '链接',       insert: '\x3Ca href="所要链接的地址"\x3E显示文字\x3C/a\x3E' },
                    { label: '走马灯',     insert: '\x3Cmarquee\x3E需要滚动的字\x3C/marquee\x3E' },
                    { label: '弹来弹去',   insert: '\x3Cmarquee width=400 behavior=alternate direction=left align=middle\x3E弹来弹去跑马灯!\x3C/marquee\x3E' },
                    { label: '加粗',       insert: '\x3Cb\x3E需要加粗的字\x3C/b\x3E' },
                    { label: '变大',       insert: '\x3Cbig\x3E需要变大的字\x3C/big\x3E' },
                    { label: '变色',       insert: '\x3Cfont color="#ff0000"\x3E变色文字\x3C/font\x3E' },
                    { label: '背景图',     insert: '\x3Cbody background="背景图片链接"\x3E' },
                    { label: '背景色',     insert: '\x3Cbody bgcolor="#ff0000"\x3E' },
                    { label: 'CSS背景图',  insert: 'background-image: url(.png);' },
                    { label: '图标',       insert: '\x3Clink rel="shortcut icon" type="image/ico" href="favicon.ico"\x3E' },
                    { label: 'meta',       insert: '\x3Cmeta charset="UTF-8"\x3E' },

            function insertAtCursor(text) {
                var start = editor.selectionStart;
                var end = editor.selectionEnd;
                var before = editor.value.substring(0, start);
                var after = editor.value.substring(end);
                editor.value = before + text + after;
                editor.selectionStart = editor.selectionEnd = start + text.length;
                editor.focus();
                if (autoRunEnabled) { updatePreview(); } else { updatePreview(true); }
                showStatus('已插入：' + (text.length > 30 ? text.substring(0, 30) + '...' : text));
            }

            function buildSnippetPanel() {
                SNIPPETS.forEach(function(group) {
                    var row = document.createElement('div');
                    row.className = 'snippet-row';

                    var label = document.createElement('div');
                    label.className = 'snippet-group-label';
                    label.textContent = group.group;
                    row.appendChild(label);

                    var btns = document.createElement('div');
                    btns.className = 'snippet-buttons';

                    // 一键演示按钮
                    var playBtn = document.createElement('button');
                    playBtn.className = 'snippet-play-btn';
                    playBtn.type = 'button';
                    playBtn.textContent = '▶ 一键演示';
                    playBtn.title = '点击演示本组所有按钮的效果（再点一次可暂停/继续）';
                    playBtn.addEventListener('click', function() {
                        togglePlayGroup(group.items, group.group, playBtn);
                    });
                    btns.appendChild(playBtn);

                    group.items.forEach(function(item) {
                        var btn = document.createElement('button');
                        btn.className = 'snippet-btn';
                        btn.type = 'button';
                        btn.textContent = item.label;
                        btn.title = item.getInsert ? item.getInsert() : item.insert;
                        btn.addEventListener('click', function() {
                            var text = item.getInsert ? item.getInsert() : item.insert;
                            insertAtCursor(text);
                        });
                        btns.appendChild(btn);
                    });

                    row.appendChild(btns);
                    snippetPanel.appendChild(row);
                });
            }

            buildSnippetPanel();

            // ================================================================
            // 整理换行核心
            // ================================================================
            function formatHTML(code) {
                if (!code || !code.trim()) return code;

                var tokens = [];
                var i = 0;
                var len = code.length;

                var voidElements = {
                    area:1, base:1, br:1, col:1, embed:1, hr:1, img:1, input:1,
                    link:1, meta:1, param:1, source:1, track:1, wbr:1
                };

                function findTagEnd(start) {
                    var j = start + 1;
                    var inQuote = false;
                    var quoteChar = '';
                    while (j < len) {
                        var ch = code[j];
                        if (inQuote) {
                            if (ch === quoteChar) inQuote = false;
                        } else {
                            if (ch === '"' || ch === "'") { inQuote = true; quoteChar = ch; }
                            else if (ch === '>') return j;
                        }
                        j++;
                    }
                    return len - 1;
                }

                function getTagName(tag) {
                    var m = tag.match(/^\x3C\/?([a-zA-Z0-9-]+)/);
                    return m ? m[1].toLowerCase() : '';
                }

                function isClosingTag(tag) { return /^\x3C\//.test(tag); }

                function isSelfClosingTag(tag, name) {
                    if (/\/>$/.test(tag)) return true;
                    if (voidElements[name]) return true;
                    return false;
                }

                while (i < len) {
                    if (/\s/.test(code[i])) {
                        var j = i;
                        while (j < len && /\s/.test(code[j])) j++;
                        tokens.push({ type: 'text', value: code.substring(i, j) });
                        i = j;
                        continue;
                    }

                    if (code[i] === '\x3C') {
                        if (code.substr(i, 4) === '\x3C!--') {
                            var end = code.indexOf('--\x3E', i);
                            if (end !== -1) {
                                tokens.push({ type: 'tag', value: code.substring(i, end + 3) });
                                i = end + 3;
                                continue;
                            }
                        }

                        var lower = code.substring(i, Math.min(i + 10, len)).toLowerCase();
                        if (lower.indexOf('\x3Cscript') === 0 || lower.indexOf('\x3Cstyle') === 0) {
                            var tagEnd = findTagEnd(i);
                            var openTag = code.substring(i, tagEnd + 1);
                            var tagName = getTagName(openTag);
                            tokens.push({ type: 'tag', value: openTag });
                            i = tagEnd + 1;

                            var closeTag = '\x3C/' + tagName + '\x3E';
                            var closeIdx = code.toLowerCase().indexOf(closeTag.toLowerCase(), i);
                            if (closeIdx !== -1) {
                                var inner = code.substring(i, closeIdx);
                                if (inner) tokens.push({ type: 'text', value: inner, raw: true });
                                tokens.push({ type: 'tag', value: code.substring(closeIdx, closeIdx + closeTag.length) });
                                i = closeIdx + closeTag.length;
                            } else {
                                tokens.push({ type: 'text', value: code.substring(i), raw: true });
                                i = len;
                            }
                            continue;
                        }

                        var te = findTagEnd(i);
                        var tag = code.substring(i, te + 1);
                        tokens.push({ type: 'tag', value: tag });
                        i = te + 1;
                    } else {
                        var j2 = i;
                        while (j2 < len && code[j2] !== '\x3C') j2++;
                        var text = code.substring(i, j2);
                        if (text) tokens.push({ type: 'text', value: text });
                        i = j2;
                    }
                }

                var lines = [];
                tokens.forEach(function(tk) {
                    if (tk.type === 'tag') {
                        lines.push({ type: 'tag', value: tk.value.trim() });
                    } else {
                        if (tk.raw) {
                            var v = tk.value.replace(/^\s*\n/, '').replace(/\n\s*$/, '');
                            if (v.trim()) lines.push({ type: 'raw', value: v });
                        } else {
                            var v2 = tk.value.trim();
                            if (v2) lines.push({ type: 'text', value: v2 });
                        }
                    }
                });

                var indentStr = '  ';
                var output = [];
                var indent = 0;

                function willIncreaseIndent(tag) {
                    var name = getTagName(tag);
                    if (!name) return false;
                    if (isClosingTag(tag)) return false;
                    if (isSelfClosingTag(tag, name)) return false;
                    if (/^\x3C!/.test(tag)) return false;
                    return true;
                }

                lines.forEach(function(line) {
                    var val = line.value;
                    if (line.type === 'tag') {
                        var closing = isClosingTag(val);
                        if (closing) indent = Math.max(0, indent - 1);
                        if (/^\x3C!DOCTYPE/i.test(val) || /^\x3C!--/.test(val)) {
                            output.push(val);
                        } else {
                            output.push(indentStr.repeat(indent) + val);
                        }
                        if (willIncreaseIndent(val)) indent++;
                    } else if (line.type === 'raw') {
                        val.split('\n').forEach(function(rl) {
                            output.push(indentStr.repeat(indent) + rl);
                        });
                    } else {
                        output.push(indentStr.repeat(indent) + val);
                    }
                });

                return output.join('\n');
            }

            function handleFormat() {
                var raw = editor.value;
                if (!raw.trim()) { showStatus('编辑器为空，无需整理', true); return; }
                if (raw.indexOf('buildSnippetPanel') !== -1 || raw.indexOf('const SNIPPETS') !== -1 || raw.indexOf('var SNIPPETS') !== -1) {
                    showStatus('检测到工具自身代码，请清空后重新粘贴', true);
                    return;
                }
                try {
                    var formatted = formatHTML(raw);
                    editor.value = formatted;
                    updatePreview(true);
                    showStatus('✨ 已整理换行（预览已同步）');
                } catch (e) {
                    console.error(e);
                    showStatus('整理出错，请检查代码', true);
                }
            }

            formatBtn.addEventListener('click', handleFormat);
            clearBtn.addEventListener('click', clearEditor);
            runBtn.addEventListener('click', runPreview);
            newWindowBtn.addEventListener('click', openInNewWindow);
            copyBtn.addEventListener('click', copyCode);
            downloadBtn.addEventListener('click', downloadHTML);
            refreshPreviewBtn.addEventListener('click', refreshPreview);

            editor.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    runPreview();
                }
                if (e.key === 'Tab') {
                    e.preventDefault();
                    var start = editor.selectionStart;
                    var end = editor.selectionEnd;
                    editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
                    editor.selectionStart = editor.selectionEnd = start + 2;
                    if (autoRunEnabled) updatePreview();
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'F' || e.key === 'f')) {
                    e.preventDefault();
                    handleFormat();
                }
            });

            updatePreview(true);
        })();
