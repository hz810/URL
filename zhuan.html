  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(145deg, #f5f8fc 0%, #e4ecf5 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 20, 40, 0.35), 0 2px 10px rgba(0, 0, 0, 0.05);
      padding: 32px 28px;
      width: 100%;
      max-width: 950px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      color: #1a2f4e;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    textarea {
      width: 100%;
      padding: 18px 22px;
      font-size: 1.3rem;
      border: 2px solid #d0dfed;
      border-radius: 24px;
      background: white;
      resize: vertical;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
      line-height: 1.7;
      outline: none;
      transition: border 0.25s, box-shadow 0.25s;
      min-height: 110px;
      max-height: 180px;
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    textarea:focus {
      border-color: #4c7fb0;
      box-shadow: 0 0 0 4px rgba(76, 127, 176, 0.15);
    }

    .output-section {
      background: rgba(255, 255, 255, 0.75);
      border-radius: 24px;
      border: 1px solid #d9e5f0;
      padding: 20px 22px 24px;
      height: 400px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      color: #2c3e50;
      font-weight: 500;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .clear-btn {
      background: transparent;
      border: 1.5px solid #cddbe9;
      color: #4b6d8a;
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .clear-btn:hover {
      background: #ecf3fa;
      border-color: #9bb7d4;
      color: #1a3f5c;
    }

    .result-box {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 12px;
      scrollbar-width: thin;
      scrollbar-color: #b6cce0 transparent;
    }

    .result-box::-webkit-scrollbar {
      width: 6px;
    }
    .result-box::-webkit-scrollbar-thumb {
      background: #b6cce0;
      border-radius: 10px;
    }

    /* ============ 核心注音排版（使用 ruby 标签） ============ */
    .ruby-container {
      /* 不再需要 padding-top 或绝对定位，ruby 标签自动处理 */
      line-height: 2.4;        /* 行高加大，给拼音留出足够的垂直空间 */
      font-size: 1.85rem;      /* 汉字基础字号 */
      color: #0b2b44;
      word-break: break-all;
    }

    /* 整体 ruby 元素 */
    ruby {
      ruby-align: center;      /* 拼音居中于汉字上方 */
      margin: 0 2px;
    }

    /* 汉字部分 */
    ruby rb {
      font-weight: 500;
    }

    /* 拼音部分（rt） */
    ruby rt {
      font-size: 1.05rem;      /* 拼音字号，清晰加大 */
      font-weight: 600;
      color: #1e4a6e;
      font-family: 'Segoe UI', 'PingFang SC', sans-serif;
      letter-spacing: 0.3px;
      /* rt 自动位于 rb 上方，无需定位 */
    }

    /* 处理标点和英文字母的样式微调 */
    .punct {
      color: #4a6078;
      font-weight: 400;
    }

    .latin {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #2c557a;
      font-weight: 500;
    }
    
    /* 当连续英文/数字时，拼音行显示为空白，保持排版整齐 */
    .latin rt:empty::before {
      content: " ";
    }

    .placeholder {
      color: #9bafc4;
      font-style: italic;
      font-weight: 400;
      font-size: 1.1rem;
      padding: 20px 0;
      text-align: center;
      width: 100%;
    }

    .footer-note {
      margin-top: 22px;
      font-size: 0.78rem;
      color: #7b92a8;
      text-align: center;
      border-top: 1px dashed #cbdae7;
      padding-top: 16px;
      flex-shrink: 0;
    }

    .footer-note kbd {
      background: #eef4fa;
      border-radius: 6px;
      padding: 2px 8px;
      font-family: monospace;
      font-size: 0.75rem;
      border: 1px solid #c4d4e3;
      color: #2f577b;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>
    📖 宏仔中文转拼音注音
  </h1>

  <textarea id="inputText" placeholder="例如：你好，世界！" autofocus></textarea>

  <div class="output-section">
    <div class="output-header">
      <span>🔤 注音结果</span>
      <button class="clear-btn" id="clearBtn">✕ 清空</button>
    </div>
    <div class="result-box" id="resultBox"></div>
  </div>



<script src="zhuan.js"></script>

<script>
  (function() {
    const { pinyin } = pinyinPro;

    const inputText = document.getElementById('inputText');
    const resultBox = document.getElementById('resultBox');
    const clearBtn = document.getElementById('clearBtn');

    // 全角标点集合
    const punctuationSet = new Set([
      '，', '。', '！', '？', '、', '；', '：', '“', '”', '‘', '’',
      '（', '）', '《', '》', '【', '】', '…', '—', '～', '·',
      ',', '.', '!', '?', ':', ';', '"', "'", '(', ')',
      '[', ']', '{', '}', '~', '@', '#', '$', '%', '^', '&', '*',
      '-', '_', '+', '=', '|', '\\', '/', '<', '>'
    ]);

    function isEnglishLetter(ch) { return /^[a-zA-Z]$/.test(ch); }
    function isDigit(ch) { return /^[0-9]$/.test(ch); }
    function isSpace(ch) { return /^\s$/.test(ch); }

    function renderRuby(text) {
      if (!text.trim()) {
        resultBox.innerHTML = '<div class="placeholder"></div>';
        return;
      }

      const pinyinArray = pinyin(text, {
        type: 'array',
        toneType: 'symbol',
        nonZh: 'consecutive'
      });

      let html = '<div class="ruby-container">';
      let i = 0;

      while (i < text.length) {
        const char = text[i];
        const py = pinyinArray[i] || '';

        const isPunct = punctuationSet.has(char);
        const isEnglish = isEnglishLetter(char);
        const isNum = isDigit(char);
        const isSp = isSpace(char);

        // 处理换行
        if (char === '\n') {
          html += '<br>';
          i++;
          continue;
        }

        // 处理空格
        if (isSp) {
          html += '<span style="display:inline-block;width:0.6em;"></span>';
          i++;
          continue;
        }

        // 处理标点
        if (isPunct) {
          html += `<ruby class="punct"><rb>${escapeHtml(char)}</rb><rt></rt></ruby>`;
          i++;
          continue;
        }

        // 处理英文/数字
        if (isEnglish || isNum) {
          // 对于英文/数字，我们不显示拼音，但保留 rt 标签占位，防止行高塌陷
          html += `<ruby class="latin"><rb>${escapeHtml(char)}</rb><rt></rt></ruby>`;
          i++;
          continue;
        }

        // 处理汉字：拼音在 rt 中
        html += `<ruby><rb>${escapeHtml(char)}</rb><rt>${escapeHtml(py)}</rt></ruby>`;
        i++;
      }

      html += '</div>';
      resultBox.innerHTML = html;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        if (m === "'") return '&#39;';
        return m;
      });
    }

    function updatePinyin() { renderRuby(inputText.value); }

    inputText.addEventListener('input', updatePinyin);

    clearBtn.addEventListener('click', function() {
      inputText.value = '';
      updatePinyin();
      inputText.focus();
    });

    updatePinyin();
  })();
</script>
</body>
</html>
