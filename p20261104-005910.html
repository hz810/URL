<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHP 你好世界 · 开始学习</title>
    <style>
        /* 干净、现代、带一点 PHP 紫的视觉风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f6f2fc 0%, #e9e0f5 100%);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #1e1a2f;
        }

        .card {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 3.5rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 30px 50px -20px rgba(74, 44, 128, 0.4),
                        0 0 0 1px rgba(136, 94, 201, 0.1) inset;
            padding: 3rem 2.5rem;
            transition: all 0.25s ease;
            text-align: center;
        }

        /* 带一点俏皮的 PHP 符号装饰 */
        .php-emblem {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #787cb5;
            color: white;
            width: 4.5rem;
            height: 4.5rem;
            border-radius: 2rem;
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            box-shadow: 0 18px 28px -14px #5e4b8b;
            margin-bottom: 1.5rem;
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            transform: rotate(-3deg);
            transition: transform 0.2s;
        }

        .php-emblem:hover {
            transform: rotate(0deg) scale(1.02);
        }

        h1 {
            font-size: clamp(2.5rem, 10vw, 4.8rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin: 0.5rem 0 0.75rem;
            background: linear-gradient(135deg, #3b2b62, #7b5ea7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(140, 100, 200, 0.15);
        }

        .hello-world {
            font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace;
            font-size: clamp(1.8rem, 7vw, 3.8rem);
            font-weight: 500;
            background: #1e1a2f;
            color: #f0eaff;
            display: inline-block;
            padding: 0.9rem 2.2rem;
            border-radius: 120px;
            letter-spacing: 0.5px;
            margin: 1rem 0 1.5rem;
            box-shadow: 0 20px 30px -12px #2e1e4d, 0 0 0 2px #9b7fd4 inset;
            word-break: break-word;
        }

        .hello-world span {
            color: #c7a5ff;
            font-weight: 600;
        }

        .tagline {
            font-size: clamp(1.2rem, 4vw, 1.7rem);
            font-weight: 400;
            color: #3e2d5e;
            margin: 1.8rem 0 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.3rem 0.8rem;
            line-height: 1.5;
        }

        .tagline .badge {
            background: #ffffffd9;
            padding: 0.35rem 1.3rem;
            border-radius: 60px;
            font-size: 0.9em;
            font-weight: 600;
            color: #5a3f8a;
            border: 1px solid #cdb8f0;
            box-shadow: 0 4px 10px rgba(149, 117, 205, 0.15);
            backdrop-filter: blur(4px);
            letter-spacing: 0.3px;
        }

        .meta-lines {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.7rem 1.5rem;
            margin: 2.5rem 0 1.8rem;
            font-size: 1.05rem;
            font-weight: 500;
            color: #4d3b6b;
        }

        .meta-lines code {
            background: #ffffffcc;
            padding: 0.45rem 1.1rem;
            border-radius: 50px;
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            color: #372a51;
            border: 1px solid #dbcaf5;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }

        .meta-lines code:hover {
            background: #ffffff;
            border-color: #b79ae0;
        }

        .divider {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #bca3e6, #7e60b0, #bca3e6);
            border-radius: 4px;
            margin: 1.5rem auto 1.8rem;
            opacity: 0.6;
        }

        .footnote {
            font-size: 0.95rem;
            color: #6b5a86;
            letter-spacing: 0.2px;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .footnote .heart {
            color: #a07fd6;
            font-size: 1.2rem;
            line-height: 1;
            transform: translateY(1px);
        }

        /* 响应式调整 */
        @media (max-width: 520px) {
            .card {
                padding: 2.5rem 1.5rem;
                border-radius: 2.5rem;
            }

            .php-emblem {
                width: 3.8rem;
                height: 3.8rem;
                font-size: 2rem;
                border-radius: 1.6rem;
            }

            .hello-world {
                padding: 0.7rem 1.5rem;
                font-size: 1.6rem;
            }

            .meta-lines code {
                font-size: 0.8rem;
                padding: 0.35rem 0.9rem;
            }
        }

        /* 无障碍/选择颜色 */
        ::selection {
            background: #bca3e6;
            color: #1a1025;
        }

        /* 淡淡的动画 */
        @keyframes softFloat {
            0% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-4px) rotate(-1deg); }
            100% { transform: translateY(0px) rotate(-3deg); }
        }

        .php-emblem {
            animation: softFloat 5s ease-in-out infinite;
        }

        /* 让标语也轻轻呼吸 */
        .hello-world {
            transition: box-shadow 0.3s, transform 0.2s;
        }

        .hello-world:hover {
            box-shadow: 0 24px 36px -14px #2e1e4d, 0 0 0 3px #b79ae0 inset;
            transform: scale(1.005);
        }
    </style>
</head>
<body>
    <main class="card">
        <!-- PHP 风格徽章 -->
        <div class="php-emblem" aria-label="PHP 符号"><?php echo 'PHP'; ?></div>
        
        <!-- 核心标语: 你好世界 / Hello World -->
        <h1>你好，世界</h1>
        <div class="hello-world">
            <span>&lt;?php</span> echo "Hello, World!"; <span>?&gt;</span>
        </div>

        <!-- 学习标语 + 徽章 -->
        <div class="tagline">
            <span>🚀 从零开始</span>
            <span class="badge">PHP 学习第一行</span>
            <span>✨ 无限可能</span>
        </div>

        <!-- 元信息: 版本 / 变量 / 命令 (视觉装饰) -->
        <div class="meta-lines">
            <code>PHP 8.3+</code>
            <code>echo</code>
            <code>print</code>
            <code>$_SERVER</code>
            <code>localhost:8000</code>
        </div>

        <div class="divider"></div>

        <!-- 脚注 -->
        <div class="footnote">
            <span>保持好奇 · 持续编码</span>
            <span class="heart">♥</span>
            <span>PHP 是搭建动态网页的起点</span>
        </div>
    </main>
</body>
</html>
