<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 你好世界 · 赛博霓虹</title>
    <style>
        /* 赛博朋克霓虹风格 · 深紫背景 + 青粉霓虹光 + 故障感 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #08040f;
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(0, 240, 255, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 200, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(120, 0, 255, 0.06) 0%, transparent 60%);
            font-family: 'Segoe UI', 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #e8e0ff;
            overflow-x: hidden;
        }

        /* 网格背景叠加 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .cyber-card {
            max-width: 820px;
            width: 100%;
            background: rgba(12, 6, 24, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 4px;
            padding: 3rem 2.5rem;
            position: relative;
            z-index: 1;
            box-shadow: 
                0 0 30px rgba(0, 240, 255, 0.1),
                0 0 80px rgba(255, 0, 200, 0.06),
                inset 0 0 40px rgba(0, 240, 255, 0.02);
        }

        /* 四角霓虹装饰 */
        .cyber-card::before,
        .cyber-card::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            border: 2px solid #00f0ff;
            box-shadow: 0 0 12px #00f0ff;
            pointer-events: none;
        }

        .cyber-card::before {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }

        .cyber-card::after {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }

        /* 顶部状态条 */
        .cyber-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 2rem;
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .status-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .status-light {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00f0ff;
            box-shadow: 0 0 10px #00f0ff;
            animation: pulse-cyan 2s ease-in-out infinite;
        }

        .status-light.pink {
            background: #ff00c8;
            box-shadow: 0 0 10px #ff00c8;
            animation-delay: 0.5s;
        }

        @keyframes pulse-cyan {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px #00f0ff; }
            50% { opacity: 0.5; box-shadow: 0 0 20px #00f0ff; }
        }

        .status-text {
            color: #00f0ff;
            opacity: 0.8;
        }

        .status-text.pink {
            color: #ff00c8;
        }

        /* 主标题区 */
        .hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .system-label {
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: #ff00c8;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            text-shadow: 0 0 15px rgba(255, 0, 200, 0.6);
        }

        .glitch-title {
            font-size: clamp(2.6rem, 9vw, 5rem);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -0.02em;
            color: #fff;
            position: relative;
            display: inline-block;
            text-shadow: 
                0 0 10px rgba(0, 240, 255, 0.8),
                0 0 40px rgba(0, 240, 255, 0.3);
        }

        .glitch-title .neon-cyan {
            color: #00f0ff;
            text-shadow: 
                0 0 10px #00f0ff,
                0 0 30px #00f0ff,
                0 0 60px rgba(0, 240, 255, 0.5);
        }

        .glitch-title .neon-pink {
            color: #ff00c8;
            text-shadow: 
                0 0 10px #ff00c8,
                0 0 30px #ff00c8,
                0 0 60px rgba(255, 0, 200, 0.5);
        }

        /* 故障效果 */
        .glitch-title::before,
        .glitch-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.7;
            pointer-events: none;
        }

        .glitch-title::before {
            color: #00f0ff;
            animation: glitch-1 3s infinite linear alternate-reverse;
            clip-path: inset(0 0 60% 0);
            transform: translate(-2px, -2px);
        }

        .glitch-title::after {
            color: #ff00c8;
            animation: glitch-2 2.5s infinite linear alternate-reverse;
            clip-path: inset(60% 0 0 0);
            transform: translate(2px, 2px);
        }

        @keyframes glitch-1 {
            0%, 90%, 100% { clip-path: inset(0 0 60% 0); transform: translate(-2px, -2px); }
            92% { clip-path: inset(20% 0 40% 0); transform: translate(2px, -1px); }
            94% { clip-path: inset(50% 0 20% 0); transform: translate(-1px, 1px); }
            96% { clip-path: inset(10% 0 70% 0); transform: translate(1px, 2px); }
        }

        @keyframes glitch-2 {
            0%, 88%, 100% { clip-path: inset(60% 0 0 0); transform: translate(2px, 2px); }
            90% { clip-path: inset(30% 0 30% 0); transform: translate(-2px, 1px); }
            93% { clip-path: inset(70% 0 10% 0); transform: translate(1px, -1px); }
            95% { clip-path: inset(40% 0 50% 0); transform: translate(-1px, -2px); }
        }

        /* 代码终端窗口 */
        .code-window {
            background: #06030c;
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 4px;
            margin: 2rem 0;
            overflow: hidden;
            box-shadow: 
                0 0 25px rgba(0, 240, 255, 0.1),
                inset 0 0 30px rgba(0, 240, 255, 0.02);
        }

        .window-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            background: rgba(0, 240, 255, 0.05);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
        }

        .win-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ff00c8;
            box-shadow: 0 0 6px #ff00c8;
        }

        .win-dot:nth-child(2) {
            background: #ffb800;
            box-shadow: 0 0 6px #ffb800;
        }

        .win-dot:nth-child(3) {
            background: #00f0ff;
            box-shadow: 0 0 6px #00f0ff;
        }

        .window-title {
            margin-left: auto;
            margin-right: auto;
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: rgba(0, 240, 255, 0.6);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .window-body {
            padding: 1.6rem 1.8rem;
        }

        .code-line {
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: clamp(1.1rem, 3.5vw, 1.6rem);
            line-height: 1.6;
            word-break: break-word;
        }

        .code-line .tag-cyan {
            color: #00f0ff;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
        }

        .code-line .text-white {
            color: #fff;
            font-weight: 600;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .code-line .tag-pink {
            color: #ff00c8;
            text-shadow: 0 0 12px rgba(255, 0, 200, 0.5);
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.1em;
            background: #00f0ff;
            vertical-align: text-bottom;
            margin-left: 4px;
            box-shadow: 0 0 15px #00f0ff;
            animation: blink-neon 0.9s step-end infinite;
        }

        @keyframes blink-neon {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 标语行 */
        .cyber-tagline {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.8rem 1.2rem;
            margin: 2.2rem 0;
        }

        .cyber-badge {
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 0.55rem 1.2rem;
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #00f0ff;
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
            transition: all 0.25s;
            position: relative;
        }

        .cyber-badge.pink {
            border-color: rgba(255, 0, 200, 0.4);
            color: #ff00c8;
            background: rgba(255, 0, 200, 0.05);
            box-shadow: 0 0 15px rgba(255, 0, 200, 0.1);
        }

        .cyber-badge:hover {
            border-color: #00f0ff;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
            transform: translateY(-2px);
        }

        .cyber-badge.pink:hover {
            border-color: #ff00c8;
            box-shadow: 0 0 25px rgba(255, 0, 200, 0.3);
        }

        /* 标签网格 */
        .tag-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin: 2rem 0;
            padding-top: 1.8rem;
            border-top: 1px solid rgba(0, 240, 255, 0.12);
        }

        .tag-chip {
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            padding: 0.4rem 0.9rem;
            border-radius: 2px;
            background: rgba(0, 240, 255, 0.04);
            border: 1px solid rgba(0, 240, 255, 0.15);
            color: rgba(0, 240, 255, 0.7);
            transition: all 0.2s;
        }

        .tag-chip:nth-child(even) {
            background: rgba(255, 0, 200, 0.04);
            border-color: rgba(255, 0, 200, 0.15);
            color: rgba(255, 0, 200, 0.7);
        }

        .tag-chip:hover {
            border-color: #00f0ff;
            color: #00f0ff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
        }

        .tag-chip:nth-child(even):hover {
            border-color: #ff00c8;
            color: #ff00c8;
            box-shadow: 0 0 12px rgba(255, 0, 200, 0.2);
        }

        /* 底部状态栏 */
        .bottom-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            padding-top: 1.8rem;
            border-top: 1px solid rgba(0, 240, 255, 0.12);
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(232, 224, 255, 0.4);
        }

        .bottom-bar .neon-cyan-text {
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .bottom-bar .neon-pink-text {
            color: #ff00c8;
            text-shadow: 0 0 10px rgba(255, 0, 200, 0.4);
        }

        /* 扫描线效果 */
        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.08) 2px,
                rgba(0, 0, 0, 0.08) 4px
            );
            z-index: 999;
            opacity: 0.4;
        }

        /* 响应式 */
        @media (max-width: 540px) {
            .cyber-card {
                padding: 2rem 1.4rem;
            }

            .window-body {
                padding: 1.2rem 1.2rem;
            }

            .code-line {
                font-size: 1rem;
            }

            .cyber-badge {
                font-size: 0.7rem;
                padding: 0.45rem 0.9rem;
            }

            .tag-chip {
                font-size: 0.65rem;
                padding: 0.35rem 0.7rem;
            }

            .bottom-bar {
                font-size: 0.62rem;
            }
        }

        ::selection {
            background: #00f0ff;
            color: #08040f;
        }
    </style>
</head>
<body>
    <!-- 扫描线覆盖层 -->
    <div class="scanlines" aria-hidden="true"></div>

    <main class="cyber-card">
        <!-- 顶部状态条 -->
        <div class="cyber-status">
            <div class="status-group">
                <span class="status-light"></span>
                <span class="status-text">SYSTEM ONLINE</span>
            </div>
            <div class="status-group">
                <span class="status-text pink">HTML LEARNING PROTOCOL</span>
                <span class="status-light pink"></span>
            </div>
        </div>

        <!-- 主标题区 -->
        <div class="hero">
            <div class="system-label">// FIRST_LESSON_LOADED</div>
            <h1 class="glitch-title" data-text="你好，世界">
                你好，<span class="neon-cyan">世</span><span class="neon-pink">界</span>
            </h1>
        </div>

        <!-- 代码终端窗口 -->
        <div class="code-window">
            <div class="window-bar">
                <span class="win-dot"></span>
                <span class="win-dot"></span>
                <span class="win-dot"></span>
                <span class="window-title">index.html — 终端</span>
            </div>
            <div class="window-body">
                <div class="code-line">
                    <span class="tag-cyan">&lt;h1&gt;</span>
                    <span class="text-white">Hello, World!</span>
                    <span class="cursor" aria-hidden="true"></span>
                    <span class="tag-pink">&lt;/h1&gt;</span>
                </div>
            </div>
        </div>

        <!-- 标语徽章 -->
        <div class="cyber-tagline">
            <span class="cyber-badge">从零开始</span>
            <span class="cyber-badge pink">HTML 学习第一行</span>
            <span class="cyber-badge">无限可能</span>
        </div>

        <!-- 标签网格 -->
        <div class="tag-grid">
            <span class="tag-chip">HTML5</span>
            <span class="tag-chip">&lt;!DOCTYPE&gt;</span>
            <span class="tag-chip">&lt;html&gt;</span>
            <span class="tag-chip">&lt;head&gt;</span>
            <span class="tag-chip">&lt;body&gt;</span>
            <span class="tag-chip">&lt;h1&gt;</span>
            <span class="tag-chip">&lt;p&gt;</span>
            <span class="tag-chip">&lt;a&gt;</span>
            <span class="tag-chip">&lt;img&gt;</span>
            <span class="tag-chip">&lt;div&gt;</span>
        </div>

        <!-- 底部状态栏 -->
        <div class="bottom-bar">
            <span class="neon-cyan-text">保持好奇 · 持续编码</span>
            <span>◈</span>
            <span class="neon-pink-text">HTML 是搭建网页结构的起点</span>
        </div>
    </main>
</body>
</html>
