<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 你好世界 · 自然森系</title>
    <style>
        /* 自然森系风格 · 森林绿 + 大地色 + 柔和有机形状 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e8ede4;
            background-image: 
                radial-gradient(ellipse at 20% 30%, rgba(120, 160, 100, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(160, 180, 120, 0.12) 0%, transparent 50%);
            font-family: 'Segoe UI', 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #2e3a2a;
            position: relative;
            overflow-x: hidden;
        }

        /* 柔和的背景装饰圆 */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width: 350px;
            height: 350px;
            background: rgba(140, 175, 110, 0.1);
            top: -100px;
            left: -100px;
            filter: blur(40px);
        }

        body::after {
            width: 400px;
            height: 400px;
            background: rgba(180, 200, 140, 0.08);
            bottom: -120px;
            right: -120px;
            filter: blur(50px);
        }

        .nature-card {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 253, 248, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 40px 40px 40px 8px;
            border: 1px solid rgba(140, 170, 110, 0.25);
            padding: 3rem 2.8rem;
            position: relative;
            z-index: 1;
            box-shadow: 
                0 25px 60px -25px rgba(70, 100, 50, 0.25),
                0 0 0 1px rgba(200, 220, 180, 0.3) inset;
        }

        /* 顶部叶形装饰 */
        .leaf-decor {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
            color: #7a9a62;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .leaf-decor svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .leaf-decor .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(140, 170, 110, 0.4), transparent);
        }

        /* 主内容 */
        .hero {
            margin-bottom: 2.5rem;
        }

        .hero-label {
            font-size: 0.8rem;
            color: #8aaa6e;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .hero-title {
            font-size: clamp(2.6rem, 9vw, 5rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: #2e3a2a;
            margin-bottom: 0.5rem;
        }

        .hero-title .leaf-accent {
            color: #6a9a4a;
            position: relative;
            display: inline-block;
        }

        .hero-title .leaf-accent::after {
            content: '';
            position: absolute;
            bottom: 0.12em;
            left: 0;
            right: 0;
            height: 0.12em;
            background: rgba(140, 190, 100, 0.4);
            border-radius: 4px;
            z-index: -1;
        }

        .hero-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            line-height: 1.7;
            color: #5a6e4e;
            max-width: 85%;
            margin-top: 1.2rem;
        }

        /* 代码有机卡片 */
        .code-organic {
            background: #f4f8ef;
            border: 1.5px solid rgba(140, 175, 110, 0.3);
            border-radius: 28px 28px 28px 8px;
            padding: 2rem 2.2rem;
            margin: 2.2rem 0;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 30px -15px rgba(90, 120, 60, 0.15);
        }

        .code-organic::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #8aba6a, #a8c88a, #6a9a4a);
            border-radius: 4px 0 0 4px;
        }

        .code-caption {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #8aaa6e;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .code-caption svg {
            width: 14px;
            height: 14px;
            color: #8aba6a;
        }

        .code-line {
            font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
            font-size: clamp(1.1rem, 3.5vw, 1.7rem);
            line-height: 1.6;
            color: #3a4e32;
            word-break: break-word;
        }

        .code-line .tag {
            color: #7a9a62;
            font-weight: 500;
        }

        .code-line .text {
            color: #2e3a2a;
            font-weight: 700;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #8aba6a;
            vertical-align: text-bottom;
            margin-left: 3px;
            animation: blink-nature 1.2s step-end infinite;
            border-radius: 1px;
        }

        @keyframes blink-nature {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 标语行 */
        .nature-tagline {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.7rem 1rem;
            margin: 2rem 0;
        }

        .tag-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.88rem;
            color: #5a7a42;
            background: rgba(255, 255, 255, 0.7);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            border: 1px solid rgba(160, 190, 130, 0.35);
            transition: all 0.25s;
            backdrop-filter: blur(4px);
        }

        .tag-pill:hover {
            background: rgba(240, 248, 230, 0.95);
            border-color: #8aba6a;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px -6px rgba(100, 140, 70, 0.25);
        }

        .tag-pill .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #8aba6a;
            flex-shrink: 0;
        }

        .tag-pill:nth-child(2) .dot {
            background: #a8c88a;
        }

        .tag-pill:nth-child(3) .dot {
            background: #6a9a4a;
        }

        /* 标签列表 */
        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 2rem 0;
            padding-top: 1.8rem;
            border-top: 1px dashed rgba(140, 170, 110, 0.3);
        }

        .tag-item {
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            padding: 0.4rem 0.95rem;
            border-radius: 50px;
            background: rgba(240, 248, 230, 0.6);
            border: 1px solid rgba(160, 190, 130, 0.25);
            color: #6a8a52;
            transition: all 0.2s;
        }

        .tag-item:hover {
            background: #e4f0d8;
            border-color: #8aba6a;
            color: #4a6a32;
        }

        /* 底部信息 */
        .nature-footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            padding-top: 1.5rem;
            margin-top: 0.5rem;
            border-top: 1px solid rgba(140, 170, 110, 0.2);
            font-size: 0.82rem;
            color: #7a8a6a;
        }

        .nature-footer .footer-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nature-footer .leaf-icon {
            color: #8aba6a;
            font-size: 0.9rem;
        }

        /* 响应式 */
        @media (max-width: 540px) {
            .nature-card {
                padding: 2rem 1.5rem;
                border-radius: 30px 30px 30px 6px;
            }

            .code-organic {
                padding: 1.5rem 1.3rem;
                border-radius: 20px 20px 20px 6px;
            }

            .code-line {
                font-size: 1rem;
            }

            .tag-pill {
                font-size: 0.8rem;
                padding: 0.4rem 1rem;
            }

            .tag-item {
                font-size: 0.68rem;
                padding: 0.35rem 0.8rem;
            }

            .hero-subtitle {
                max-width: 100%;
            }
        }

        ::selection {
            background: #c8e0b0;
            color: #2e3a2a;
        }
    </style>
</head>
<body>
    <main class="nature-card">
        <!-- 顶部叶形装饰 -->
        <div class="leaf-decor">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
                <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
            </svg>
            <span>Learning HTML</span>
            <div class="line"></div>
        </div>

        <!-- 主内容 -->
        <div class="hero">
            <div class="hero-label">第一章 · 第一行</div>
            <h1 class="hero-title">
                你好，<span class="leaf-accent">世界</span>
            </h1>
            <p class="hero-subtitle">
                每一棵参天大树，都从一颗小小的种子开始。今天，你种下了第一行 HTML——它会长成一片属于你的网页森林。
            </p>
        </div>

        <!-- 代码有机卡片 -->
        <div class="code-organic">
            <div class="code-caption">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6"/>
                    <polyline points="8 6 2 12 8 18"/>
                </svg>
                我的第一行代码
            </div>
            <div class="code-line">
                <span class="tag">&lt;h1&gt;</span>
                <span class="text">Hello, World!</span>
                <span class="cursor" aria-hidden="true"></span>
                <span class="tag">&lt;/h1&gt;</span>
            </div>
        </div>

        <!-- 标语行 -->
        <div class="nature-tagline">
            <span class="tag-pill"><span class="dot"></span>从零开始</span>
            <span class="tag-pill"><span class="dot"></span>HTML 学习第一行</span>
            <span class="tag-pill"><span class="dot"></span>无限可能</span>
        </div>

        <!-- 标签列表 -->
        <div class="tag-list">
            <span class="tag-item">HTML5</span>
            <span class="tag-item">&lt;!DOCTYPE&gt;</span>
            <span class="tag-item">&lt;html&gt;</span>
            <span class="tag-item">&lt;head&gt;</span>
            <span class="tag-item">&lt;body&gt;</span>
            <span class="tag-item">&lt;h1&gt;</span>
            <span class="tag-item">&lt;p&gt;</span>
            <span class="tag-item">&lt;a&gt;</span>
            <span class="tag-item">&lt;img&gt;</span>
            <span class="tag-item">&lt;div&gt;</span>
        </div>

        <!-- 底部信息 -->
        <div class="nature-footer">
            <span class="footer-item"><span class="leaf-icon">☘</span> 保持好奇 · 持续成长</span>
            <span class="footer-item"><span class="leaf-icon">✦</span> HTML 是搭建网页结构的起点</span>
        </div>
    </main>
</body>
</html>
