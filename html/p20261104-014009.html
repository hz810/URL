<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 你好世界 · 艺术装饰</title>
    <style>
        /* 艺术装饰 Art Deco 风格 · 黑金配色 + 几何对称 + 扇形与线条 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d0d;
            background-image: 
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 40px,
                    rgba(201, 169, 97, 0.015) 40px,
                    rgba(201, 169, 97, 0.015) 41px
                ),
                repeating-linear-gradient(
                    -45deg,
                    transparent,
                    transparent 40px,
                    rgba(201, 169, 97, 0.015) 40px,
                    rgba(201, 169, 97, 0.015) 41px
                );
            font-family: 'Didot', 'Bodoni MT', 'Playfair Display', Georgia, 'Songti SC', serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #d4c5a0;
        }

        .deco-card {
            max-width: 820px;
            width: 100%;
            background: #111111;
            position: relative;
            padding: 3.5rem 3rem;
            border: 1px solid rgba(201, 169, 97, 0.35);
            box-shadow: 
                0 0 0 6px #111111,
                0 0 0 7px rgba(201, 169, 97, 0.25),
                0 0 80px -20px rgba(201, 169, 97, 0.12);
        }

        /* 内框 */
        .deco-card::before {
            content: '';
            position: absolute;
            inset: 14px;
            border: 1px solid rgba(201, 169, 97, 0.18);
            pointer-events: none;
        }

        /* 四角扇形装饰 */
        .corner {
            position: absolute;
            width: 70px;
            height: 70px;
            pointer-events: none;
            opacity: 0.8;
        }

        .corner svg {
            width: 100%;
            height: 100%;
        }

        .corner.tl { top: 4px; left: 4px; }
        .corner.tr { top: 4px; right: 4px; transform: scaleX(-1); }
        .corner.bl { bottom: 4px; left: 4px; transform: scaleY(-1); }
        .corner.br { bottom: 4px; right: 4px; transform: scale(-1, -1); }

        /* 顶部装饰条 */
        .top-ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .ornament-line {
            height: 1px;
            width: 60px;
            background: linear-gradient(90deg, transparent, #c9a961);
        }

        .ornament-line.right {
            background: linear-gradient(90deg, #c9a961, transparent);
        }

        .ornament-diamond {
            display: flex;
            gap: 0.4rem;
        }

        .diamond {
            width: 8px;
            height: 8px;
            background: #c9a961;
            transform: rotate(45deg);
            box-shadow: 0 0 10px rgba(201, 169, 97, 0.4);
        }

        .diamond.small {
            width: 5px;
            height: 5px;
            opacity: 0.6;
        }

        /* 主标题区 */
        .hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .hero-kicker {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: #c9a961;
            margin-bottom: 1.5rem;
            opacity: 0.85;
        }

        .hero-title {
            font-size: clamp(2.8rem, 10vw, 5.5rem);
            font-weight: 400;
            line-height: 1;
            letter-spacing: 0.06em;
            color: #e8dcc0;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            padding: 0 1rem;
            text-shadow: 0 2px 20px rgba(201, 169, 97, 0.15);
        }

        .hero-title .gold {
            color: #c9a961;
            text-shadow: 0 0 30px rgba(201, 169, 97, 0.35);
        }

        /* 标题下方花饰 */
        .title-flourish {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1.2rem;
        }

        .title-flourish .line {
            height: 1px;
            width: 80px;
            background: linear-gradient(90deg, transparent, rgba(201, 169, 97, 0.6));
        }

        .title-flourish .line.right {
            background: linear-gradient(90deg, rgba(201, 169, 97, 0.6), transparent);
        }

        .title-flourish .fan {
            color: #c9a961;
            font-size: 1.1rem;
            letter-spacing: 0.3em;
        }

        /* 代码展示区 */
        .code-deco {
            background: #0a0a0a;
            border: 1px solid rgba(201, 169, 97, 0.25);
            padding: 2rem 2.2rem;
            margin: 2.5rem 0;
            position: relative;
            text-align: center;
        }

        /* 上下金色细线 */
        .code-deco::before,
        .code-deco::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c9a961, transparent);
        }

        .code-deco::before {
            top: -1px;
        }

        .code-deco::after {
            bottom: -1px;
        }

        .code-caption {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #c9a961;
            margin-bottom: 1.2rem;
            opacity: 0.7;
        }

        .code-line {
            font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
            font-size: clamp(1.1rem, 3.5vw, 1.6rem);
            line-height: 1.6;
            letter-spacing: 0.02em;
            word-break: break-word;
        }

        .code-line .tag {
            color: #c9a961;
            font-weight: 500;
        }

        .code-line .text {
            color: #e8dcc0;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.1em;
            background: #c9a961;
            vertical-align: text-bottom;
            margin-left: 5px;
            animation: blink-deco 1s step-end infinite;
        }

        @keyframes blink-deco {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* 标语行 */
        .deco-tagline {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1rem 1.5rem;
            margin: 2.2rem 0;
        }

        .deco-badge {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #c9a961;
            padding: 0.5rem 1.3rem;
            border: 1px solid rgba(201, 169, 97, 0.4);
            position: relative;
            transition: all 0.3s;
            background: transparent;
        }

        .deco-badge::before,
        .deco-badge::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            background: #c9a961;
            transform: rotate(45deg);
            opacity: 0.5;
        }

        .deco-badge::before {
            top: -2.5px;
            left: -2.5px;
        }

        .deco-badge::after {
            bottom: -2.5px;
            right: -2.5px;
        }

        .deco-badge:hover {
            border-color: #c9a961;
            background: rgba(201, 169, 97, 0.05);
            box-shadow: 0 0 20px rgba(201, 169, 97, 0.1);
        }

        /* 分隔装饰 */
        .deco-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            margin: 1.8rem 0;
        }

        .deco-divider .line {
            height: 1px;
            width: 100px;
            background: linear-gradient(90deg, transparent, rgba(201, 169, 97, 0.35));
        }

        .deco-divider .line.right {
            background: linear-gradient(90deg, rgba(201, 169, 97, 0.35), transparent);
        }

        .deco-divider .star {
            color: #c9a961;
            font-size: 0.7rem;
            letter-spacing: 0.4em;
            opacity: 0.7;
        }

        /* 标签列表 */
        .tag-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin: 1.5rem 0;
        }

        .tag-item {
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            padding: 0.35rem 0.9rem;
            border: 1px solid rgba(201, 169, 97, 0.18);
            color: rgba(201, 169, 97, 0.7);
            background: transparent;
            transition: all 0.25s;
            letter-spacing: 0.03em;
        }

        .tag-item:hover {
            border-color: #c9a961;
            color: #c9a961;
            background: rgba(201, 169, 97, 0.04);
        }

        /* 底部信息 */
        .deco-footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            padding-top: 1.8rem;
            margin-top: 1rem;
            border-top: 1px solid rgba(201, 169, 97, 0.15);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: rgba(201, 169, 97, 0.5);
        }

        .deco-footer .footer-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .deco-footer .gold-text {
            color: #c9a961;
        }

        /* 响应式 */
        @media (max-width: 540px) {
            .deco-card {
                padding: 2.5rem 1.5rem;
            }

            .corner {
                width: 45px;
                height: 45px;
            }

            .code-deco {
                padding: 1.5rem 1.2rem;
            }

            .code-line {
                font-size: 1rem;
            }

            .deco-badge {
                font-size: 0.6rem;
                padding: 0.4rem 1rem;
                letter-spacing: 2px;
            }

            .tag-item {
                font-size: 0.62rem;
                padding: 0.3rem 0.7rem;
            }

            .deco-footer {
                font-size: 0.58rem;
                letter-spacing: 1.5px;
            }

            .hero-kicker {
                letter-spacing: 5px;
                font-size: 0.58rem;
            }
        }

        ::selection {
            background: #c9a961;
            color: #111;
        }
    </style>
</head>
<body>
    <main class="deco-card">
        <!-- 四角扇形装饰 -->
        <div class="corner tl" aria-hidden="true">
            <svg viewBox="0 0 70 70" fill="none" stroke="#c9a961" stroke-width="0.8">
                <path d="M2 2 L2 30" opacity="0.6"/>
                <path d="M2 2 L30 2" opacity="0.6"/>
                <path d="M2 2 L2 18" opacity="0.3"/>
                <path d="M2 2 L18 2" opacity="0.3"/>
                <line x1="2" y1="2" x2="22" y2="22" stroke-width="0.6" opacity="0.4"/>
                <line x1="2" y1="2" x2="14" y2="26" stroke-width="0.6" opacity="0.3"/>
                <line x1="2" y1="2" x2="26" y2="14" stroke-width="0.6" opacity="0.3"/>
                <circle cx="2" cy="2" r="2" fill="#c9a961" opacity="0.5"/>
            </svg>
        </div>
        <div class="corner tr" aria-hidden="true">
            <svg viewBox="0 0 70 70" fill="none" stroke="#c9a961" stroke-width="0.8">
                <path d="M2 2 L2 30" opacity="0.6"/>
                <path d="M2 2 L30 2" opacity="0.6"/>
                <path d="M2 2 L2 18" opacity="0.3"/>
                <path d="M2 2 L18 2" opacity="0.3"/>
                <line x1="2" y1="2" x2="22" y2="22" stroke-width="0.6" opacity="0.4"/>
                <line x1="2" y1="2" x2="14" y2="26" stroke-width="0.6" opacity="0.3"/>
                <line x1="2" y1="2" x2="26" y2="14" stroke-width="0.6" opacity="0.3"/>
                <circle cx="2" cy="2" r="2" fill="#c9a961" opacity="0.5"/>
            </svg>
        </div>
        <div class="corner bl" aria-hidden="true">
            <svg viewBox="0 0 70 70" fill="none" stroke="#c9a961" stroke-width="0.8">
                <path d="M2 2 L2 30" opacity="0.6"/>
                <path d="M2 2 L30 2" opacity="0.6"/>
                <path d="M2 2 L2 18" opacity="0.3"/>
                <path d="M2 2 L18 2" opacity="0.3"/>
                <line x1="2" y1="2" x2="22" y2="22" stroke-width="0.6" opacity="0.4"/>
                <line x1="2" y1="2" x2="14" y2="26" stroke-width="0.6" opacity="0.3"/>
                <line x1="2" y1="2" x2="26" y2="14" stroke-width="0.6" opacity="0.3"/>
                <circle cx="2" cy="2" r="2" fill="#c9a961" opacity="0.5"/>
            </svg>
        </div>
        <div class="corner br" aria-hidden="true">
            <svg viewBox="0 0 70 70" fill="none" stroke="#c9a961" stroke-width="0.8">
                <path d="M2 2 L2 30" opacity="0.6"/>
                <path d="M2 2 L30 2" opacity="0.6"/>
                <path d="M2 2 L2 18" opacity="0.3"/>
                <path d="M2 2 L18 2" opacity="0.3"/>
                <line x1="2" y1="2" x2="22" y2="22" stroke-width="0.6" opacity="0.4"/>
                <line x1="2" y1="2" x2="14" y2="26" stroke-width="0.6" opacity="0.3"/>
                <line x1="2" y1="2" x2="26" y2="14" stroke-width="0.6" opacity="0.3"/>
                <circle cx="2" cy="2" r="2" fill="#c9a961" opacity="0.5"/>
            </svg>
        </div>

        <!-- 顶部装饰条 -->
        <div class="top-ornament">
            <div class="ornament-line"></div>
            <div class="ornament-diamond">
                <div class="diamond small"></div>
                <div class="diamond"></div>
                <div class="diamond small"></div>
            </div>
            <div class="ornament-line right"></div>
        </div>

        <!-- 主标题区 -->
        <div class="hero">
            <div class="hero-kicker">第一章 · 起点</div>
            <h1 class="hero-title">
                你好，<span class="gold">世界</span>
            </h1>
            <div class="title-flourish">
                <div class="line"></div>
                <span class="fan">✦ ✦ ✦</span>
                <div class="line right"></div>
            </div>
        </div>

        <!-- 代码展示区 -->
        <div class="code-deco">
            <div class="code-caption">第一行代码 · The First Line</div>
            <div class="code-line">
                <span class="tag">&lt;h1&gt;</span>
                <span class="text">Hello, World!</span>
                <span class="cursor" aria-hidden="true"></span>
                <span class="tag">&lt;/h1&gt;</span>
            </div>
        </div>

        <!-- 标语徽章 -->
        <div class="deco-tagline">
            <span class="deco-badge">从零开始</span>
            <span class="deco-badge">HTML 学习第一行</span>
            <span class="deco-badge">无限可能</span>
        </div>

        <!-- 分隔装饰 -->
        <div class="deco-divider">
            <div class="line"></div>
            <span class="star">◆ ◆ ◆</span>
            <div class="line right"></div>
        </div>

        <!-- 标签列表 -->
        <div class="tag-list">
            <span class="tag-item">HTML5</span>
            <span class="tag-item">&lt;!DOCTYPE&gt;</span>
            <span class="tag-item">&lt;html&gt;</span>
            <span class="tag-item">&lt;head&gt;</span>
            <span class="tag-item">&lt;body&gt;</span>
            <span class="tag-item">&lt;h1&gt;</span>
            <span class="tag-item">&lt;p&gt;</span>
            <span class="tag-item">&lt;a&gt;</span>
            <span class="tag-item">&lt;img&gt;</span>
            <span class="tag-item">&lt;div&gt;</span>
        </div>

        <!-- 底部信息 -->
        <div class="deco-footer">
            <span class="footer-item"><span class="gold-text">✦</span> 保持好奇 · 持续编码</span>
            <span class="footer-item"><span class="gold-text">◆</span> HTML 是搭建网页结构的起点</span>
        </div>
    </main>
</body>
</html>
