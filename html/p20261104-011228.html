<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 你好世界 · 开始学习</title>
    <style>
        /* 干净、现代、带一点 HTML 橙的视觉风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #fef6ef 0%, #fde8d7 100%);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #2e1e12;
        }

        .card {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 3.5rem;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 30px 50px -20px rgba(180, 100, 40, 0.35),
                        0 0 0 1px rgba(230, 140, 60, 0.12) inset;
            padding: 3rem 2.5rem;
            transition: all 0.25s ease;
            text-align: center;
        }

        /* HTML 风格徽章 — 用尖括号装饰 */
        .html-emblem {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #e44d26;
            color: white;
            width: 4.5rem;
            height: 4.5rem;
            border-radius: 2rem;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            box-shadow: 0 18px 28px -14px #b13e1c;
            margin-bottom: 1.5rem;
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            transform: rotate(-3deg);
            transition: transform 0.2s;
        }

        .html-emblem:hover {
            transform: rotate(0deg) scale(1.02);
        }

        h1 {
            font-size: clamp(2.5rem, 10vw, 4.8rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin: 0.5rem 0 0.75rem;
            background: linear-gradient(135deg, #8a3a1a, #e0652e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(220, 120, 50, 0.15);
        }

        .hello-world {
            font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace;
            font-size: clamp(1.5rem, 5.5vw, 3.2rem);
            font-weight: 500;
            background: #2e1e12;
            color: #fff4ec;
            display: inline-block;
            padding: 0.9rem 2.2rem;
            border-radius: 120px;
            letter-spacing: 0.5px;
            margin: 1rem 0 1.5rem;
            box-shadow: 0 20px 30px -12px #4d2e1a, 0 0 0 2px #e08a52 inset;
            word-break: break-word;
            max-width: 100%;
        }

        .hello-world span {
            color: #ffb685;
            font-weight: 600;
        }

        .tagline {
            font-size: clamp(1.2rem, 4vw, 1.7rem);
            font-weight: 400;
            color: #4e3322;
            margin: 1.8rem 0 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.3rem 0.8rem;
            line-height: 1.5;
        }

        .tagline .badge {
            background: #ffffffd9;
            padding: 0.35rem 1.3rem;
            border-radius: 60px;
            font-size: 0.9em;
            font-weight: 600;
            color: #a84e1f;
            border: 1px solid #f0c7a8;
            box-shadow: 0 4px 10px rgba(220, 130, 60, 0.15);
            backdrop-filter: blur(4px);
            letter-spacing: 0.3px;
        }

        .meta-lines {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.7rem 1.5rem;
            margin: 2.5rem 0 1.8rem;
            font-size: 1.05rem;
            font-weight: 500;
            color: #5d4030;
        }

        .meta-lines code {
            background: #ffffffcc;
            padding: 0.45rem 1.1rem;
            border-radius: 50px;
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            color: #3d2a1c;
            border: 1px solid #f2d2bb;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }

        .meta-lines code:hover {
            background: #ffffff;
            border-color: #e6a77e;
        }

        .divider {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #f2c09c, #d47038, #f2c09c);
            border-radius: 4px;
            margin: 1.5rem auto 1.8rem;
            opacity: 0.6;
        }

        .footnote {
            font-size: 0.95rem;
            color: #7c5c48;
            letter-spacing: 0.2px;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .footnote .heart {
            color: #e0652e;
            font-size: 1.2rem;
            line-height: 1;
            transform: translateY(1px);
        }

        /* 响应式调整 */
        @media (max-width: 520px) {
            .card {
                padding: 2.5rem 1.5rem;
                border-radius: 2.5rem;
            }

            .html-emblem {
                width: 3.8rem;
                height: 3.8rem;
                font-size: 1.3rem;
                border-radius: 1.6rem;
            }

            .hello-world {
                padding: 0.7rem 1.2rem;
                font-size: 1.15rem;
            }

            .meta-lines code {
                font-size: 0.8rem;
                padding: 0.35rem 0.9rem;
            }
        }

        /* 无障碍/选择颜色 */
        ::selection {
            background: #f2c09c;
            color: #2a180e;
        }

        /* 淡淡的动画 */
        @keyframes softFloat {
            0% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-4px) rotate(-1deg); }
            100% { transform: translateY(0px) rotate(-3deg); }
        }

        .html-emblem {
            animation: softFloat 5s ease-in-out infinite;
        }

        /* 让标语也轻轻呼吸 */
        .hello-world {
            transition: box-shadow 0.3s, transform 0.2s;
        }

        .hello-world:hover {
            box-shadow: 0 24px 36px -14px #4d2e1a, 0 0 0 3px #e6a77e inset;
            transform: scale(1.005);
        }
    </style>
</head>
<body>
    <main class="card">
        <!-- HTML 风格徽章：尖括号 + 文字 -->
        <div class="html-emblem" aria-label="HTML 符号">&lt;/&gt;</div>

        <!-- 核心标语: 你好世界 / Hello World (HTML 示例) -->
        <h1>你好，世界</h1>
        <div class="hello-world">
            <span>&lt;h1&gt;</span>Hello, World!<span>&lt;/h1&gt;</span>
        </div>

        <!-- 学习标语 + 徽章 -->
        <div class="tagline">
            <span>🚀 从零开始</span>
            <span class="badge">HTML 学习第一行</span>
            <span>✨ 无限可能</span>
        </div>

        <!-- 元信息: 版本 / 标签 / 属性 (视觉装饰) -->
        <div class="meta-lines">
            <code>HTML5</code>
            <code>&lt;!DOCTYPE html&gt;</code>
            <code>p</code>
            <code>div</code>
            <code>a href</code>
        </div>

        <div class="divider"></div>

        <!-- 脚注 -->
        <div class="footnote">
            <span>保持好奇 · 持续编码</span>
            <span class="heart">♥</span>
            <span>HTML 是搭建网页结构的起点</span>
        </div>
    </main>
</body>
</html>
