<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 你好世界 · 终端风格</title>
    <style>
        /* 终端极简风格 · 深色背景 + 等宽字体 + 荧光绿点缀 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e0a;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 255, 100, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(0, 255, 180, 0.05) 0%, transparent 40%);
            font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #b8f0c8;
        }

        .terminal-card {
            max-width: 780px;
            width: 100%;
            background: #0d130d;
            border-radius: 14px;
            border: 1px solid #1e3a1e;
            box-shadow: 
                0 0 0 1px rgba(0, 255, 100, 0.06),
                0 25px 60px -15px rgba(0, 0, 0, 0.9),
                0 0 60px -20px rgba(0, 255, 100, 0.15);
            overflow: hidden;
        }

        /* 终端标题栏 */
        .terminal-bar {
            background: #111a11;
            padding: 0.75rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-bottom: 1px solid #1a2e1a;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot.red { background: #ff5f57; }
        .dot.yellow { background: #febc2e; }
        .dot.green { background: #28c840; }

        .terminal-title {
            margin-left: auto;
            margin-right: auto;
            font-size: 0.8rem;
            color: #5a7a5a;
            letter-spacing: 0.5px;
        }

        /* 终端内容区 */
        .terminal-body {
            padding: 2.2rem 2rem 2.5rem;
        }

        /* 命令行样式 */
        .line {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            margin-bottom: 0.4rem;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .prompt {
            color: #28c840;
            font-weight: 600;
            flex-shrink: 0;
            user-select: none;
        }

        .command {
            color: #e8ffe8;
        }

        .comment {
            color: #4a6a4a;
            font-style: italic;
        }

        /* 主标语区 */
        .hero {
            margin: 2rem 0 2.5rem;
            position: relative;
        }

        .hero-label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #2e7a2e;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .hero-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, #1e3a1e, transparent);
        }

        .hello-block {
            background: #0a110a;
            border-left: 3px solid #28c840;
            border-radius: 0 8px 8px 0;
            padding: 1.5rem 1.8rem;
            position: relative;
            overflow: hidden;
        }

        .hello-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(40, 200, 64, 0.03), transparent 60%);
            pointer-events: none;
        }

        .hello-tag {
            color: #28c840;
            font-size: clamp(0.9rem, 2.5vw, 1.15rem);
            font-weight: 500;
            letter-spacing: 0.5px;
            word-break: break-word;
        }

        .hello-text {
            font-size: clamp(2.2rem, 8vw, 4.2rem);
            font-weight: 700;
            color: #e8ffe8;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin: 0.5rem 0;
            text-shadow: 0 0 30px rgba(40, 200, 64, 0.25);
        }

        .hello-text .accent {
            color: #28c840;
        }

        .hello-close {
            color: #28c840;
            font-size: clamp(0.9rem, 2.5vw, 1.15rem);
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0.85;
        }

        /* 光标闪烁 */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.1em;
            background: #28c840;
            vertical-align: text-bottom;
            margin-left: 4px;
            animation: blink 1s step-end infinite;
            box-shadow: 0 0 10px rgba(40, 200, 64, 0.6);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 标语行 */
        .tagline-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem 1.2rem;
            margin: 2rem 0;
        }

        .tag-item {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.92rem;
            color: #8ac89a;
            background: #0f1a0f;
            padding: 0.5rem 1.1rem;
            border-radius: 6px;
            border: 1px solid #1e3a1e;
            transition: all 0.2s;
        }

        .tag-item:hover {
            border-color: #2e7a2e;
            background: #122412;
            color: #b8f0c8;
        }

        .tag-item .icon {
            color: #28c840;
            font-weight: 700;
        }

        /* 技术栈标签 */
        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 1.8rem 0;
            padding-top: 1.5rem;
            border-top: 1px dashed #1a2e1a;
        }

        .tech-tag {
            font-size: 0.78rem;
            color: #5a9a6a;
            background: #0a110a;
            padding: 0.35rem 0.85rem;
            border-radius: 4px;
            border: 1px solid #152415;
            transition: all 0.2s;
        }

        .tech-tag:hover {
            color: #28c840;
            border-color: #28c840;
            box-shadow: 0 0 12px rgba(40, 200, 64, 0.15);
        }

        /* 底部状态栏 */
        .status-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            padding-top: 1.5rem;
            margin-top: 0.5rem;
            border-top: 1px solid #152415;
            font-size: 0.8rem;
            color: #4a6a4a;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #28c840;
            box-shadow: 0 0 8px #28c840;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-right {
            color: #3a5a3a;
        }

        /* 响应式 */
        @media (max-width: 540px) {
            .terminal-body {
                padding: 1.5rem 1.2rem 1.8rem;
            }

            .hello-block {
                padding: 1.2rem 1.2rem;
            }

            .terminal-title {
                font-size: 0.7rem;
            }

            .line {
                font-size: 0.82rem;
            }

            .tag-item {
                font-size: 0.82rem;
                padding: 0.4rem 0.9rem;
            }

            .tech-tag {
                font-size: 0.72rem;
            }
        }

        ::selection {
            background: #28c840;
            color: #0a0e0a;
        }
    </style>
</head>
<body>
    <main class="terminal-card">
        <!-- 终端标题栏 -->
        <div class="terminal-bar">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="terminal-title">~/learn-html — zsh</span>
        </div>

        <!-- 终端内容 -->
        <div class="terminal-body">
            <!-- 模拟命令行 -->
            <div class="line">
                <span class="prompt">$</span>
                <span class="command">mkdir hello-world && cd hello-world</span>
            </div>
            <div class="line">
                <span class="prompt">$</span>
                <span class="command">touch index.html</span>
            </div>
            <div class="line">
                <span class="prompt">$</span>
                <span class="comment"># 写下你的第一行 HTML</span>
            </div>

            <!-- 主标语 -->
            <div class="hero">
                <div class="hero-label">first-lesson</div>
                <div class="hello-block">
                    <div class="hello-tag">&lt;h1&gt;</div>
                    <div class="hello-text">
                        你好，<span class="accent">世界</span>
                        <span class="cursor" aria-hidden="true"></span>
                    </div>
                    <div class="hello-close">&lt;/h1&gt;</div>
                </div>
            </div>

            <!-- 标签行 -->
            <div class="tagline-row">
                <span class="tag-item"><span class="icon">→</span> 从零开始</span>
                <span class="tag-item"><span class="icon">◆</span> HTML 学习第一行</span>
                <span class="tag-item"><span class="icon">✦</span> 无限可能</span>
            </div>

            <!-- 技术栈标签 -->
            <div class="tech-stack">
                <span class="tech-tag">HTML5</span>
                <span class="tech-tag">&lt;!DOCTYPE html&gt;</span>
                <span class="tech-tag">&lt;html&gt;</span>
                <span class="tech-tag">&lt;head&gt;</span>
                <span class="tech-tag">&lt;body&gt;</span>
                <span class="tech-tag">&lt;h1&gt;</span>
                <span class="tech-tag">&lt;p&gt;</span>
                <span class="tech-tag">&lt;a&gt;</span>
            </div>

            <!-- 状态栏 -->
            <div class="status-bar">
                <div class="status-left">
                    <span class="status-dot"></span>
                    <span>保持好奇 · 持续编码</span>
                </div>
                <div class="status-right">HTML 是搭建网页结构的起点</div>
            </div>
        </div>
    </main>
</body>
</html>
